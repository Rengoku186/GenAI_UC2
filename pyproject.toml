[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-modernizer"
version = "0.1.0"
description = "Autonomous Multi-Agent System for Modernizing Legacy COBOL, VB, and Java to Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Legacy Modernizer Team" }
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
    "networkx>=3.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0"
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "jupyter>=1.0.0"
]

[project.scripts]
modernize = "src.orchestrator.graph:main"
dashboard = "src.dashboard.app:run_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
